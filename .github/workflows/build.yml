name: Build ImmortalWrt x86_64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'seed.config'
      - 'feeds.extra.conf'
      - 'files/**'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TAG: v24.10.6
      REPO_URL: https://github.com/immortalwrt/immortalwrt.git
      WORKDIR: ${{ github.workspace }}/immortalwrt
      JOBS: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show system info
        run: |
          uname -a
          lsb_release -a || true
          df -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget curl libelf-dev ecj fastjar java-propose-classpath python3 \
            python3-pyelftools subversion swig time xsltproc zip libxml-parser-perl \
            ccache qemu-utils

      - name: Clone ImmortalWrt source
        run: |
          rm -rf "${WORKDIR}"
          git clone --single-branch --branch "${TAG}" "${REPO_URL}" "${WORKDIR}"
          cd "${WORKDIR}"
          git rev-parse HEAD

      - name: Merge custom feeds
        run: |
          cd "${WORKDIR}"
          cp feeds.conf.default feeds.conf
          echo "" >> feeds.conf
          cat "${GITHUB_WORKSPACE}/feeds.extra.conf" >> feeds.conf
          echo "========== feeds.conf =========="
          cat feeds.conf

      - name: Update feeds
        run: |
          cd "${WORKDIR}"
          ./scripts/feeds update -a

      - name: Show package search result
        run: |
          cd "${WORKDIR}"
          ./scripts/feeds search luci-app-passwall2 || true
          ./scripts/feeds search luci-app-ddnsto || true
          ./scripts/feeds search luci-app-nikki || true
          ./scripts/feeds search luci-app-smartdns || true
          ./scripts/feeds search dockerd || true
          ./scripts/feeds search frpc || true
          ./scripts/feeds search frps || true

      - name: Install feeds
        run: |
          cd "${WORKDIR}"
          ./scripts/feeds install -a

      - name: Copy custom files
        run: |
          cd "${WORKDIR}"
          rsync -a "${GITHUB_WORKSPACE}/files/" "${WORKDIR}/files/"

      - name: Copy seed config
        run: |
          cd "${WORKDIR}"
          cp "${GITHUB_WORKSPACE}/seed.config" .config
          make defconfig
          echo "========== Selected config =========="
          grep -E "CONFIG_TARGET_x86|CONFIG_TARGET_x86_64|CONFIG_EFI_IMAGES|CONFIG_TARGET_ROOTFS_SQUASHFS|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_USE_APK|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_dockerd|CONFIG_PACKAGE_luci-app-passwall2|CONFIG_PACKAGE_luci-app-ddnsto|CONFIG_PACKAGE_luci-app-nikki|CONFIG_PACKAGE_smartdns|CONFIG_PACKAGE_luci-app-smartdns|CONFIG_PACKAGE_kmod-igc|CONFIG_PACKAGE_kmod-ixgbe" .config || true

      - name: Download sources
        run: |
          cd "${WORKDIR}"
          make download -j"${JOBS}"

      - name: Build firmware
        run: |
          cd "${WORKDIR}"
          make -j"${JOBS}" V=s || make -j1 V=s

      - name: Show feed commits
        run: |
          cd "${WORKDIR}"
          for d in feeds/*; do
            [ -d "$d/.git" ] && echo "$d -> $(git -C "$d" rev-parse HEAD)"
          done || true

      - name: Prepare artifacts
        run: |
          cd "${WORKDIR}"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cp .config "${GITHUB_WORKSPACE}/artifacts/" || true
          cp -av bin/targets/x86/64/*combined-efi.img.gz "${GITHUB_WORKSPACE}/artifacts/" || true
          cp -av bin/targets/x86/64/*manifest "${GITHUB_WORKSPACE}/artifacts/" || true
          cp -av bin/targets/x86/64/*buildinfo "${GITHUB_WORKSPACE}/artifacts/" || true
          cp -av bin/targets/x86/64/sha256sums "${GITHUB_WORKSPACE}/artifacts/" || true
          find "${GITHUB_WORKSPACE}/artifacts" -maxdepth 1 -type f -ls || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86_64-24.10.6
          path: artifacts/
          if-no-files-found: warn
