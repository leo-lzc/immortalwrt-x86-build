name: Build ImmortalWrt x86

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/build.yml"
      - "seed.config"
      - "feeds.extra.conf"
      - "files/**"

concurrency:
  group: immortalwrt-x86-build
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: master
  WORKDIR: immortalwrt
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl \
            ccache xz-utils patch jq zip libelf-dev

      - name: Validate repository files
        shell: bash
        run: |
          set -euxo pipefail

          test -f seed.config
          test -f feeds.extra.conf

          sed -i 's/\r$//' seed.config
          sed -i 's/\r$//' feeds.extra.conf

          echo "Repository files:"
          ls -la

          echo "Custom files:"
          if [ -d files ]; then
            find files -type f -maxdepth 5 -print
          else
            echo "No files directory found."
          fi

          echo "Checking x86 target in seed.config:"
          grep -E '^CONFIG_TARGET_x86=' seed.config || true
          grep -E '^CONFIG_TARGET_x86_64=' seed.config || true

      - name: Clone ImmortalWrt source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 -b "${REPO_BRANCH}" "${REPO_URL}" "${WORKDIR}"

      - name: Apply custom files
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d files ]; then
            mkdir -p "${WORKDIR}/files"
            rsync -a files/ "${WORKDIR}/files/"
          fi

      - name: Update and install feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"

          if [ -s "../feeds.extra.conf" ]; then
            cat "../feeds.extra.conf" >> feeds.conf.default
          fi

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply seed config
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"

          cp "../seed.config" .config
          make defconfig

          echo "Final target:"
          grep -E '^CONFIG_TARGET_' .config | head -n 20 || true

      - name: Download package sources
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"

          make download -j"$(nproc)"
          find dl -size -1024c -print -delete || true

      - name: Build firmware
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"

          make -j"$(nproc)" || make -j1 V=s

      - name: Collect firmware
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          SRC="${WORKDIR}/bin/targets"
          OUT="${GITHUB_WORKSPACE}/release-firmware"

          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            dest="${OUT}/${base}"

            if [ -e "$dest" ]; then
              h="$(printf '%s' "${f#${SRC}/}" | sha1sum | cut -c1-8)"
              name="${base%.*}"
              ext=""

              case "$base" in
                *.*) ext=".${base##*.}" ;;
              esac

              dest="${OUT}/${name}-${h}${ext}"
            fi

            cp -f "$f" "$dest"
          done < <(
            find "${SRC}" -type f ! -path '*/packages/*' \
              \( \
                -name '*.bin' -o \
                -name '*.img' -o \
                -name '*.itb' -o \
                -name '*.trx' -o \
                -name '*.ubi' -o \
                -name '*.gz' \
              \) \
              -print0
          )

          echo "Collected firmware:"
          find "${OUT}" -maxdepth 1 -type f -print

          test -n "$(find "${OUT}" -maxdepth 1 -type f -print -quit)"

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware
          path: release-firmware/
          if-no-files-found: error
          retention-days: 7

  release:
    runs-on: ubuntu-22.04
    needs: build
    if: needs.build.result == 'success' && github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: immortalwrt-firmware
          path: firmware

      - name: Package firmware
        id: meta
        shell: bash
        run: |
          set -euxo pipefail

          test -n "$(find firmware -maxdepth 1 -type f -print -quit)"

          BUILD_DATE="$(TZ="${TZ}" date '+%Y%m%d-%H%M%S')"
          SHORT_SHA="${GITHUB_SHA::7}"

          TAG="immortalwrt-${BUILD_DATE}-${SHORT_SHA}-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          RELEASE_NAME="ImmortalWrt ${BUILD_DATE} (${SHORT_SHA})"
          ZIP_NAME="immortalwrt-firmware-${BUILD_DATE}-${SHORT_SHA}-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}.zip"

          mkdir -p release-assets

          (
            cd firmware
            sha256sum ./* > SHA256SUMS
            mapfile -d '' files < <(find . -maxdepth 1 -type f -print0 | sort -z)
            zip -j -9 "../release-assets/${ZIP_NAME}" "${files[@]}"
          )

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${RELEASE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "zip_name=${ZIP_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          generate_release_notes: true
          files: release-assets/${{ steps.meta.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
