name: Build ImmortalWrt

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "feeds.extra.conf"
      - "seed.config"

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: master
  WORKDIR: immortalwrt
  FEEDS_FILE: feeds.extra.conf
  CONFIG_FILE: seed.config

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint build-essential \
            bison ccache cmake cpio curl device-tree-compiler fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gperf haveged help2man intltool \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool lrzsz msmtp nano ninja-build p7zip-full \
            patch pkgconf python3 python3-pip python3-ply python3-docutils rsync \
            scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xxd \
            zlib1g-dev zstd

      - name: Clone source
        run: |
          git clone --depth=1 -b "${REPO_BRANCH}" "${REPO_URL}" "${WORKDIR}"

      - name: Prepare feeds config
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"
          if [ -f "../${FEEDS_FILE}" ]; then
            sed -i 's/\r$//' "../${FEEDS_FILE}"
            echo "" >> feeds.conf.default
            echo "# custom feeds" >> feeds.conf.default
            cat "../${FEEDS_FILE}" >> feeds.conf.default
          fi
          echo "===== feeds.conf.default ====="
          cat feeds.conf.default | tee feeds.conf.default.dump

      - name: Check custom feed remotes
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"

          : > feeds-remote-check.log

          if [ -f "../${FEEDS_FILE}" ]; then
            while read -r type name url; do
              [ -z "${type:-}" ] && continue
              [[ "${type}" =~ ^# ]] && continue

              case "${type}" in
                src-git|src-git-full)
                  clean_url="${url%%;*}"
                  echo "===== CHECK ${name} -> ${clean_url} =====" | tee -a feeds-remote-check.log
                  git ls-remote "${clean_url}" HEAD 2>&1 | tee -a feeds-remote-check.log
                  ;;
                *)
                  echo "SKIP ${type} ${name} ${url}" | tee -a feeds-remote-check.log
                  ;;
              esac
            done < "../${FEEDS_FILE}"
          else
            echo "No ${FEEDS_FILE} found." | tee -a feeds-remote-check.log
          fi

      - name: Update feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"

          : > feeds-update.log

          retry_update() {
            local feed="$1"
            local n=0

            until ./scripts/feeds update "${feed}" 2>&1 | tee -a feeds-update.log; do
              n=$((n+1))
              if [ "${n}" -ge 3 ]; then
                echo "ERROR: feed '${feed}' update failed after 3 tries" | tee -a feeds-update.log
                return 1
              fi
              echo "Retry ${n}/3 for feed '${feed}' after 10 seconds..." | tee -a feeds-update.log
              sleep 10
            done
          }

          while read -r feed; do
            echo "===== updating feed: ${feed} =====" | tee -a feeds-update.log
            retry_update "${feed}"
          done < <(awk '/^src-(git|git-full|svn|link|cpy)/ {print $2}' feeds.conf.default)

          echo "===== feeds directory =====" | tee -a feeds-update.log
          ls -lah feeds 2>&1 | tee -a feeds-update.log || true

          echo "===== passwall2 directory check =====" | tee -a feeds-update.log
          [ -d feeds/passwall2 ] && echo "passwall2 exists" | tee -a feeds-update.log || (echo "passwall2 missing" | tee -a feeds-update.log; exit 1)

      - name: Install feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"
          ./scripts/feeds install -a 2>&1 | tee feeds-install.log

      - name: Copy seed config
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"
          cp "../${CONFIG_FILE}" .config
          make defconfig 2>&1 | tee defconfig.log

      - name: Download sources
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"
          make download -j"$(nproc)" 2>&1 | tee download.log
          find dl -size -1024c -type f -print -delete || true

      - name: Build firmware
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"
          make -j"$(nproc)" V=s 2>&1 | tee build.log || \
          (make -j1 V=s 2>&1 | tee -a build.log; exit 1)

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            immortalwrt/feeds.conf.default
            immortalwrt/feeds.conf.default.dump
            immortalwrt/feeds-remote-check.log
            immortalwrt/feeds-update.log
            immortalwrt/feeds-install.log
            immortalwrt/defconfig.log
            immortalwrt/download.log
            immortalwrt/build.log
            immortalwrt/.config
          if-no-files-found: warn

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            immortalwrt/bin/targets/**/*
          if-no-files-found: warn
