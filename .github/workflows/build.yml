name: Build ImmortalWrt

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "feeds.extra.conf"
      - "seed.config"

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: master
  WORKDIR: immortalwrt
  FEEDS_FILE: feeds.extra.conf
  CONFIG_FILE: seed.config
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner info
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          df -hT

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          df -hT

      - name: Set timezone
        shell: bash
        run: |
          set -euxo pipefail
          sudo timedatectl set-timezone "${TZ}" || true
          date

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint build-essential \
            bison ccache cmake cpio curl device-tree-compiler fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gperf haveged help2man intltool \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool lrzsz msmtp nano ninja-build p7zip-full \
            patch pkgconf python3 python3-pip python3-ply python3-docutils rsync \
            scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xxd \
            zlib1g-dev zstd

      - name: Clone source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 -b "${REPO_BRANCH}" "${REPO_URL}" "${WORKDIR}"

      - name: Prepare feeds config
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"

          if [ -f "../${FEEDS_FILE}" ]; then
            sed -i 's/\r$//' "../${FEEDS_FILE}"
            echo "" >> feeds.conf.default
            echo "# custom feeds" >> feeds.conf.default
            cat "../${FEEDS_FILE}" >> feeds.conf.default
          fi

          echo "===== feeds.conf.default ====="
          cat feeds.conf.default | tee feeds.conf.default.dump

      - name: Check custom feed remotes
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"

          : > feeds-remote-check.log

          if [ -f "../${FEEDS_FILE}" ]; then
            sed -i 's/\r$//' "../${FEEDS_FILE}"

            while read -r type name url; do
              [ -z "${type:-}" ] && continue
              [[ "${type}" =~ ^# ]] && continue

              type="${type%$'\r'}"
              name="${name%$'\r'}"
              url="${url%$'\r'}"

              case "${type}" in
                src-git|src-git-full)
                  clean_url="${url%%;*}"
                  clean_url="${clean_url%$'\r'}"
                  echo "===== CHECK ${name} -> ${clean_url} =====" | tee -a feeds-remote-check.log
                  git ls-remote "${clean_url}" HEAD 2>&1 | tee -a feeds-remote-check.log
                  ;;
                *)
                  echo "SKIP ${type} ${name} ${url}" | tee -a feeds-remote-check.log
                  ;;
              esac
            done < "../${FEEDS_FILE}"
          else
            echo "No ${FEEDS_FILE} found." | tee -a feeds-remote-check.log
          fi

      - name: Update feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"

          : > feeds-update.log

          retry_update() {
            local feed="$1"
            local n=0
            until ./scripts/feeds update "${feed}" 2>&1 | tee -a feeds-update.log; do
              n=$((n+1))
              if [ "${n}" -ge 3 ]; then
                echo "ERROR: feed '${feed}' update failed after 3 tries" | tee -a feeds-update.log
                return 1
              fi
              echo "Retry ${n}/3 for feed '${feed}' after 10 seconds..." | tee -a feeds-update.log
              sleep 10
            done
          }

          while read -r feed; do
            echo "===== updating feed: ${feed} =====" | tee -a feeds-update.log
            retry_update "${feed}"
          done < <(awk '/^src-(git|git-full|svn|link|cpy)/ {print $2}' feeds.conf.default | sort -u)

          echo "===== feeds directory =====" | tee -a feeds-update.log
          ls -lah feeds 2>&1 | tee -a feeds-update.log || true

          if grep -qE '^[[:space:]]*src-git[[:space:]]+passwall2[[:space:]]' feeds.conf.default; then
            echo "===== passwall2 directory check =====" | tee -a feeds-update.log
            [ -d feeds/passwall2 ] && echo "passwall2 exists" | tee -a feeds-update.log || (echo "passwall2 missing" | tee -a feeds-update.log; exit 1)
          fi

      - name: Install feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"

          if ! ./scripts/feeds install -a 2>&1 | tee feeds-install.log; then
            echo "Retry install feeds with -f" | tee -a feeds-install.log
            ./scripts/feeds install -a -f 2>&1 | tee -a feeds-install.log
          fi

      - name: Copy seed config
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' "${CONFIG_FILE}"
          cd "${WORKDIR}"
          cp "../${CONFIG_FILE}" .config
          make defconfig 2>&1 | tee defconfig.log

      - name: Download packages
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"
          make download -j"$(nproc)" 2>&1 | tee download.log
          find dl -size -1024c -print -delete || true

      - name: Build firmware
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"

          if ! make -j"$(nproc)" 2>&1 | tee build.log; then
            echo "Parallel build failed, retrying with single thread..." | tee -a build.log
            make -j1 V=s 2>&1 | tee -a build.log
          fi

      - name: Show output files
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKDIR}"
          find bin/targets -type f | sort

      - name: Prepare firmware artifact
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifact/firmware"
          cd "${WORKDIR}"
          rsync -a --exclude='packages' bin/targets/ "${GITHUB_WORKSPACE}/artifact/firmware/"

      - name: Prepare logs artifact
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifact/logs"
          cd "${WORKDIR}"

          cp -f feeds.conf.default.dump "${GITHUB_WORKSPACE}/artifact/logs/" 2>/dev/null || true
          cp -f feeds-remote-check.log "${GITHUB_WORKSPACE}/artifact/logs/" 2>/dev/null || true
          cp -f feeds-update.log "${GITHUB_WORKSPACE}/artifact/logs/" 2>/dev/null || true
          cp -f feeds-install.log "${GITHUB_WORKSPACE}/artifact/logs/" 2>/dev/null || true
          cp -f defconfig.log "${GITHUB_WORKSPACE}/artifact/logs/" 2>/dev/null || true
          cp -f download.log "${GITHUB_WORKSPACE}/artifact/logs/" 2>/dev/null || true
          cp -f build.log "${GITHUB_WORKSPACE}/artifact/logs/" 2>/dev/null || true
          cp -f .config "${GITHUB_WORKSPACE}/artifact/logs/" 2>/dev/null || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware
          path: artifact/firmware
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-logs
          path: artifact/logs
          if-no-files-found: warn
          retention-days: 7